services:

  app:
    build:
      context: .
      dockerfile: Dockerfile-build-dev
    networks:
      - local_network
    ports:
      - '8000:8000'
    volumes:
      - .:/var/www/html:cached
      - vendor_vibe:/var/www/html/vendor
    command: >
      sh -c " if [ ! -d /var/www/html/vendor ]; then
        cp -r /var/www/vendor_temp/* /var/www/html/vendor;
      fi && php artisan serve --host=0.0.0.0 --port=8000 "

volumes:
  vendor_vibe:


networks:
  local_network:
    external: true
