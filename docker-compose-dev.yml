version: '3'

services:
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_DATABASE: 'vibe_adventure'
      MYSQL_USER: 'vibe_adventure_user_admin'
      MYSQL_PASSWORD: 'adventure'
      MYSQL_ROOT_PASSWORD: 'adventure'
    ports:
      - '3306:3306'
    expose:
      - '3306'
    volumes:
      - my-db:/var/lib/mysql

volumes:
  my-db:

